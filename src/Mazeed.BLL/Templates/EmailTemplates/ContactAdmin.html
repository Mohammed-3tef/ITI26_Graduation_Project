<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Contact Notification - Mazeed+</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-font-smoothing: antialiased;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f8fafc; padding: 40px 10px;">
        <tr>
            <td align="center">
                <!-- Container -->
                <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">

                    <!-- Top Brand Bar -->
                    <tr>
                        <td style="padding: 24px 32px; border-bottom: 1px solid #f1f5f9; background-color: #ffffff;">
                            <span style="font-size: 24px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px;">Mazeed<span style="color: #ef4444;">+</span></span>
                        </td>
                    </tr>

                    <!-- Header Section -->
                    <tr>
                        <td style="padding: 32px 32px 16px 32px;">
                            <div style="display: inline-block; background-color: #fef2f2; color: #ef4444; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; margin-bottom: 12px;">
                                New Contact Message
                            </div>
                            <h1 style="margin: 0; font-size: 20px; font-weight: 700; color: #0f172a;">A new inquiry or message has been received from the website</h1>
                        </td>
                    </tr>

                    <!-- Details Box -->
                    <tr>
                        <td style="padding: 0 32px 32px 32px;">
                            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 24px;">
                                <tr>
                                    <td style="padding: 16px; border-bottom: 1px solid #e2e8f0;">
                                        <strong style="color: #64748b; font-size: 13px; display: block; margin-bottom: 2px;">Full Name</strong>
                                        <span style="color: #0f172a; font-weight: 600; font-size: 15px;">{{Name}}</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding: 16px; border-bottom: 1px solid #e2e8f0;">
                                        <strong style="color: #64748b; font-size: 13px; display: block; margin-bottom: 2px;">Email Address</strong>
                                        <a href="mailto:{{Email}}" style="color: #ef4444; font-weight: 500; text-decoration: none; font-size: 15px;">{{Email}}</a>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding: 16px;">
                                        <strong style="color: #64748b; font-size: 13px; display: block; margin-bottom: 2px;">Subject</strong>
                                        <span style="color: #0f172a; font-weight: 600; font-size: 15px;">{{Subject}}</span>
                                    </td>
                                </tr>
                            </table>

                            <!-- Message Content -->
                            <strong style="color: #0f172a; font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px;">Message Details:</strong>
                            <div style="background-color: #ffffff; border-left: 4px solid #ef4444; border-top: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; padding: 16px; border-radius: 0 8px 8px 0; color: #334155; line-height: 1.6; font-size: 14px;">
                                {{Message}}
                            </div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 32px; background-color: #f8fafc; border-top: 1px solid #e2e8f0; text-align: center;">
                            <p style="margin: 0; color: #94a3b8; font-size: 12px;">&copy; 2026 Mazeed Shopping Inc. All rights reserved.</p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
